spring:
  application:
    name: credit-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/credit_engine}
    username: ${DB_USERNAME:credit_engine}
    password: ${DB_PASSWORD:credit_engine}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
